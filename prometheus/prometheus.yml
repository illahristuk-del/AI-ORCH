global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "orchestrator"
    static_configs:
      - targets: ["host.docker.internal:11000"]
  - job_name: "hr_recruiter"
    static_configs:
      - targets: ["host.docker.internal:9999"]
  - job_name: "calendar_booker"
    static_configs:
      - targets: ["host.docker.internal:10000"]
  - job_name: "audit"
    static_configs:
      - targets: ["host.docker.internal:13000"]
  - job_name: "registry"
    static_configs:
      - targets: ["host.docker.internal:12000"]
  - job_name: "hr_mcp"
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: "calendar_mcp"
    static_configs:
      - targets: ["host.docker.internal:8001"]